name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v0.11.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache NSIS toolchain
        shell: pwsh
        timeout-minutes: 15
        run: |
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsis = Join-Path $tools "NSIS"
          if (Test-Path (Join-Path $nsis "makensis.exe")) {
            Write-Host "NSIS already cached at $nsis"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          $urls = @(
            "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip",
            "https://gh-proxy.com/https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            curl.exe -L --fail --retry 3 --retry-delay 5 --retry-max-time 180 --max-time 60 -o $zip $url
            if ($LASTEXITCODE -eq 0) {
              $downloaded = $true
              break
            }
          }
          if (-not $downloaded) { throw "NSIS download failed" }
          $zipSha1 = (Get-FileHash -Path $zip -Algorithm SHA1).Hash
          if ($zipSha1 -ne "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D") {
            throw "NSIS checksum mismatch: $zipSha1"
          }
          Expand-Archive -Path $zip -DestinationPath $tools -Force
          if (Test-Path $nsis) { Remove-Item -Path $nsis -Recurse -Force }
          Rename-Item -Path (Join-Path $tools "nsis-3.11") -NewName $nsis
          $dll = Join-Path $nsis "Plugins\x86-unicode\additional\nsis_tauri_utils.dll"
          New-Item -ItemType Directory -Force -Path (Split-Path $dll) | Out-Null
          $dllUrls = @(
            "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll",
            "https://gh-proxy.com/https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
          )
          $copied = $false
          foreach ($url in $dllUrls) {
            curl.exe -L --fail --retry 5 --retry-delay 5 --retry-max-time 180 --max-time 60 -o $dll $url
            if ($LASTEXITCODE -eq 0) {
              $copied = $true
              break
            }
          }
          if (-not $copied) { throw "NSIS plugin download failed" }
          $dllSha1 = (Get-FileHash -Path $dll -Algorithm SHA1).Hash
          if ($dllSha1 -ne "75197FEE3C6A814FE035788D1C34EAD39349B860") {
            throw "NSIS plugin checksum mismatch: $dllSha1"
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "MyAgent ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Windows installer (NSIS) is attached below."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
