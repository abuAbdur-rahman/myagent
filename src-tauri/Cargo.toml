[package]
name = "myagent"
version = "0.8.1"
description = "Windows desktop chat client with bring-your-own-key providers"
authors = ["Abu Abdir-rahman <abdulazeezadekiilekun@gmail.com>"]
repository = "https://github.com/abuAbdur-rahman/myagent"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
url = "2"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
regex = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "process", "time", "net", "fs", "io-util"] }
chrono = "0.4"
htmd = "0.5"
pdf-extract = "0.12"
docx-rs = { version = "0.4", default-features = false }
calamine = "0.36"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "derive"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ignore = "0.4.30"
globset = "0.4.19"
tauri-plugin-dialog = "2"
transcribe-rs = { path = "vendor/transcribe-rs", features = ["onnx"] }
sha2 = "0.10"
rmcp = { version = "3.7.0", default-features = false, features = ["client", "server", "auth", "reqwest", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
dirs = "7"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
uiautomation = { version = "0.25", features = ["process", "clipboard", "screenshot"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true


